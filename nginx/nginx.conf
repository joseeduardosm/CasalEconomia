# NGINX — proxy reverso para o CasalEconomia
# Usado em staging/prod; em desenvolvimento local use uvicorn e ng serve diretamente.
# /api/ → FastAPI em localhost:8000
# todo o resto → Angular em localhost:4200

server {
    listen 80;
    server_name localhost;

    # Requisições para a API FastAPI
    location /api/ {
        proxy_pass         http://localhost:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Todo o resto vai para o front-end Angular
    location / {
        proxy_pass         http://localhost:4200;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }
}
