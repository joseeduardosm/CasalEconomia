# NGINX — proxy reverso do CasalEconomia
# Acesso externo apenas pela porta 80 (sem portas na URL).
# /api/ → FastAPI em 127.0.0.1:8000
# todo o resto → Angular em 127.0.0.1:4200

server {
    listen 80;
    server_name _;

    # Requisições para a API FastAPI
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Todo o resto vai para o front-end Angular (incluindo HMR do ng serve)
    location / {
        proxy_pass         http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }
}
